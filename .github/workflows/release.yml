name: release

on:
  push:
    branches:
      - "main" 
    tags:
      - "*" 

jobs:
  build:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set VERSION variable
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # For tag pushes, use the tag version directly
          VERSION=${GITHUB_REF/refs\/tags\//}
        else
          git fetch --tags  # Ensure all tags are fetched
          
          # Get the latest base tag (e.g., "0.1.0")
          LATEST_TAG=$(git describe --tags --abbrev=0)
          
          # Get the current week using Monday as the first day
          WEEK=$(date +'%W')
          WEEK=$((10#$WEEK))
          YEAR=$(date +'%Y')
          
          # Calculate Monday of the current week (works on GNU date)
          MONDAY=$(date -d "today - $(($(date +%u)-1)) days" +%Y-%m-%d)
          
          # Count the number of commits made since Monday. The time is needed: git reads a bare date as that day at
          # the current time, so on Mondays the count was 0 and every release got the same, already published version.
          BUILD_NUMBER=$(git rev-list --count HEAD --since="$MONDAY 00:00:00")
          
          # Construct the version string with the commit count as the build number
          VERSION="${LATEST_TAG}-preview.${YEAR}.${WEEK}.${BUILD_NUMBER}"
        fi
        
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${VERSION}

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output bin -p:Version=${VERSION}

    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: Manifesto3263

    - name: Push
      run: dotnet nuget push bin/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
