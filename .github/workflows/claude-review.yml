name: Claude review

# Reviews pull requests against .github/REVIEW.md and AGENTS.md. Claude only reads and comments: it can't edit, push,
# approve or merge.
#
# - review:     runs automatically on pull requests from branches in this repository: when one is opened, reopened or
#               marked ready, and on every new push to it. A newer push cancels a review that's still running.
# - on-request: runs when someone with write access writes "@claude" in a pull request comment, for example
#               "@claude review" on a pull request from a fork, or "@claude review again" after new commits.
#
# Logs in to the Claude API with the ANTHROPIC_API_KEY secret (an organisation secret). An API key, not workload
# identity federation: Anthropic's monthly API credits for subscribers only cover the Agent SDK and `claude -p` when
# they run with an API key from the linked Console organisation. Also needs the Claude GitHub app.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [dev, main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Pull requests from forks get no secrets, and their authors can't trigger the action anyway: use "@claude review".
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    # A newer push replaces a review that's still running. Only on this job: every comment on a pull request starts
    # the workflow (Claude's own progress comment too), and those runs must not cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Review this pull request. Read .github/REVIEW.md and AGENTS.md first and follow them exactly: what to
            check, how strict to be, and how to write the comments. Read the diff with `gh pr diff` and the
            description with `gh pr view`. Post inline comments for specific problems and finish with one summary
            comment (`gh pr comment`) in the format REVIEW.md gives.

            If you reviewed this pull request before (check with `gh pr view --comments`), review the whole pull
            request again, but don't repeat comments you already made. In the summary, say which earlier problems are
            now fixed and which are still open.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Edit,Write,Bash(git push:*),mcp__github_file_ops"

  on-request:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Answer the comment
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --append-system-prompt "You review pull requests for this repository; you never change code. When asked to review, read .github/REVIEW.md and AGENTS.md first and follow them exactly, using inline comments for specific problems and one summary comment. For other questions about the pull request, answer briefly."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --disallowedTools "Edit,Write,Bash(git push:*),mcp__github_file_ops"
